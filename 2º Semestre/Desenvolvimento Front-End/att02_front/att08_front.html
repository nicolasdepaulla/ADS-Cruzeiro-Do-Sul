<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>att08_front</title>
</head>
<body>
<script>
let degrau = Number(prompt("Altura do degrau (em metros):"));
let alvo = Number(prompt("Altura que o pedreiro quer alcançar (em metros):"));
let quantidade = Math.ceil(alvo / degrau);
console.log("Ele deve subir " + quantidade + " degraus");
document.write("Ele deve subir " + quantidade + " degraus" + "<br>");
</script>
</body>
</html>
